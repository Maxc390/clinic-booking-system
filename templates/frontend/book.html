{% extends 'base.html' %}

{% block title %}Book Appointment — ClinicCare{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-8">
    <div class="border-b border-slate-800 pb-6">
        <h1 class="text-3xl font-bold text-white mb-2">Book a 30-Minute Consultation</h1>
        <p class="text-slate-400">Select a doctor and date to view available time slots in real time.</p>
    </div>

    <form action="{% url 'frontend-book' %}" method="POST" class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-8 space-y-6 shadow-xl">
        {% csrf_token %}

        <!-- Step 1: Select Doctor -->
        <div>
            <label class="block text-sm font-semibold text-slate-200 mb-2">1. Select Doctor</label>
            <select name="doctor_id" id="doctor-select" required
                hx-get="{% url 'frontend-slots-picker' %}"
                hx-trigger="change"
                hx-target="#slots-container"
                hx-include="[name='appointment_date']"
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 transition-colors">
                <option value="">-- Choose Doctor --</option>
                {% for doc in doctors %}
                    <option value="{{ doc.id }}">
                        {{ doc.full_name }} — {{ doc.specialization }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Step 2: Select Date -->
        <div>
            <label class="block text-sm font-semibold text-slate-200 mb-2">2. Select Date</label>
            <input type="date" name="appointment_date" id="date-input" min="{{ min_date }}" value="{{ min_date }}" required
                hx-get="{% url 'frontend-slots-picker' %}"
                hx-trigger="change"
                hx-target="#slots-container"
                hx-include="[name='doctor_id']"
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 transition-colors">
        </div>

        <!-- Step 3: Interactive HTMX Slot Picker -->
        <div>
            <label class="block text-sm font-semibold text-slate-200 mb-2">3. Available 30-Minute Slots</label>
            <div id="slots-container" class="bg-slate-900/60 border border-slate-800 rounded-xl p-6 min-h-[120px] flex items-center justify-center">
                <p class="text-slate-500 text-sm">Select a doctor and date above to load free slots.</p>
            </div>
        </div>

        <!-- Hidden input set by slot selection -->
        <input type="hidden" name="slot_time" id="selected-slot-input" required>

        <!-- Submit Button -->
        <button type="submit" id="book-submit-btn" disabled class="w-full bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-cyan-600/20 text-lg">
            Confirm & Book Appointment
        </button>
    </form>
</div>

<script>
    function selectSlot(timeStr, btnElement) {
        document.getElementById('selected-slot-input').value = timeStr;
        document.querySelectorAll('.slot-btn').forEach(btn => {
            btn.classList.remove('bg-cyan-500', 'text-white', 'border-cyan-400', 'ring-2', 'ring-cyan-400');
            btn.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
        });
        btnElement.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
        btnElement.classList.add('bg-cyan-500', 'text-white', 'border-cyan-400', 'ring-2', 'ring-cyan-400');
        document.getElementById('book-submit-btn').disabled = false;
    }
</script>
{% endblock %}
