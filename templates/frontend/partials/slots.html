{% if error %}
    <p class="text-amber-400 text-sm flex items-center gap-1">
        <span class="material-symbols-outlined text-base">warning</span> {{ error }}
    </p>
{% elif slots %}
    <div class="w-full">
        <p class="text-xs text-slate-400 mb-3">Available slots for {{ doctor.full_name }} on {{ target_date }}:</p>
        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
            {% for slot in slots %}
                <button type="button" onclick="selectSlot('{{ slot }}', this)" class="slot-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-mono text-sm py-2 px-3 rounded-lg transition-all text-center">
                    {{ slot }}
                </button>
            {% endfor %}
        </div>
    </div>
{% else %}
    <p class="text-slate-500 text-sm flex items-center gap-1">
        <span class="material-symbols-outlined text-base">event_busy</span> No free slots available for this date/doctor or outside shift hours.
    </p>
{% endif %}
